<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Sentry CRM" />
<meta name="theme-color" content="#1a365d" />
<title>Sentry Fence CRM Pro</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/gridjs@5.0.2/dist/gridjs.umd.js" integrity="sha384-/XXDzxe4FsGiAe50i/u9pY/Vy/uX654MHB1xoc1BJNnH1WXHhqHga9g3q5tF4gj7" crossorigin="anonymous"></script>
<style>
:root {
  color-scheme: light;
  --navy: #1a365d;
  --navy-deep: #0f1f3a;
  --navy-soft: #243b66;
  --gold: #c5a059;
  --gold-deep: #a78343;
  --gold-soft: #e2c98c;
  --cream: #fdfcfb;
  --cream-2: #f5f3ef;
  --ink: #1f2937;
  --ink-muted: #64748b;
  --ink-faint: #94a3b8;
  --line: #e5e7eb;
  --line-soft: #f1f5f9;
  --bg: #f8fafc;
  --white: #ffffff;
  --green: #059669;
  --green-soft: #ecfdf5;
  --red: #dc2626;
  --red-soft: #fef2f2;
  --amber: #d97706;
  --amber-soft: #fffbeb;
  --blue: #2563eb;
  --blue-soft: #eff6ff;
  --purple: #7c3aed;
  --purple-soft: #f5f3ff;
  --shadow-sm: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
  --shadow-md: 0 4px 6px -1px rgba(15,23,42,.08), 0 2px 4px -2px rgba(15,23,42,.04);
  --shadow-lg: 0 10px 15px -3px rgba(15,23,42,.10), 0 4px 6px -4px rgba(15,23,42,.05);
  --shadow-xl: 0 20px 25px -5px rgba(15,23,42,.12), 0 8px 10px -6px rgba(15,23,42,.08);
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", system-ui, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
input:focus, select:focus, textarea:focus { outline: none; }

.app {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: 100vh;
}

/* SIDEBAR */
.sidebar {
  background: var(--navy);
  color: #fff;
  display: flex;
  flex-direction: column;
  padding: 22px 14px;
  position: sticky;
  top: 0;
  height: 100vh;
}
.brand {
  display: flex; align-items: center; gap: 12px;
  padding: 0 8px 22px 8px;
  border-bottom: 1px solid rgba(255,255,255,.06);
  margin-bottom: 18px;
}
.brand-mark {
  width: 38px; height: 38px;
  background: var(--gold);
  color: var(--navy);
  border-radius: 8px;
  display: grid; place-items: center;
  font-weight: 800; font-style: italic; font-size: 18px;
  box-shadow: 0 4px 12px rgba(197,160,89,.35);
}
.brand-name { font-weight: 700; font-size: 15px; line-height: 1.1; letter-spacing: -.01em; }
.brand-sub { font-size: 9px; letter-spacing: .18em; color: var(--gold); font-weight: 700; text-transform: uppercase; margin-top: 3px; }

.nav { flex: 1; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.nav-section { font-size: 9px; letter-spacing: .2em; color: rgba(255,255,255,.35); font-weight: 700; padding: 14px 12px 6px; text-transform: uppercase; }
.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px;
  border-radius: 8px;
  color: rgba(255,255,255,.6);
  font-size: 13px; font-weight: 600;
  width: 100%; text-align: left;
  transition: all .15s ease;
}
.nav-item:hover { background: rgba(255,255,255,.05); color: #fff; }
.nav-item.active { background: var(--gold); color: var(--navy); box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.nav-item .ic { width: 16px; height: 16px; flex-shrink: 0; }
.nav-item .badge {
  margin-left: auto;
  background: rgba(255,255,255,.1);
  color: rgba(255,255,255,.85);
  font-size: 10px; font-weight: 700;
  padding: 2px 7px;
  border-radius: 999px;
}
.nav-item.active .badge { background: rgba(26,54,93,.15); color: var(--navy); }

.user-block {
  border-top: 1px solid rgba(255,255,255,.06);
  padding-top: 14px;
  margin-top: 10px;
}
.user-row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; }
.user-avatar {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: rgba(197,160,89,.18);
  color: var(--gold);
  display: grid; place-items: center;
  font-size: 11px; font-weight: 800;
  border: 1px solid rgba(197,160,89,.35);
}
.user-name { font-size: 12px; font-weight: 700; color: #fff; }
.user-role { font-size: 9px; letter-spacing: .18em; color: rgba(255,255,255,.4); text-transform: uppercase; font-weight: 700; }

/* MAIN */
.main { display: flex; flex-direction: column; min-width: 0; }

.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 24px;
  background: rgba(255,255,255,.85);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 30;
}
.topbar h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -.01em; color: var(--navy); }
.topbar .crumbs { font-size: 11px; color: var(--ink-faint); letter-spacing: .15em; text-transform: uppercase; font-weight: 700; }

.search-box {
  flex: 1;
  max-width: 420px;
  position: relative;
  margin-left: auto;
}
.search-box input {
  width: 100%;
  padding: 9px 14px 9px 36px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--cream);
  font-size: 13px;
  transition: all .15s ease;
}
.search-box input:focus {
  border-color: var(--gold);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(197,160,89,.12);
}
.search-box svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 14px; height: 14px; color: var(--ink-faint);
}

.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 12px; font-weight: 700;
  letter-spacing: .04em;
  transition: all .15s ease;
  white-space: nowrap;
}
.btn-primary { background: var(--navy); color: #fff; box-shadow: var(--shadow-md); }
.btn-primary:hover { background: var(--navy-deep); transform: translateY(-1px); box-shadow: var(--shadow-lg); }
.btn-gold { background: var(--gold); color: var(--navy); box-shadow: var(--shadow-md); }
.btn-gold:hover { background: var(--gold-deep); }
.btn-ghost { background: transparent; color: var(--ink-muted); border: 1px solid var(--line); }
.btn-ghost:hover { background: var(--cream); color: var(--navy); border-color: var(--gold); }
.btn-danger { background: var(--red-soft); color: var(--red); border: 1px solid #fecaca; }
.btn-danger:hover { background: var(--red); color: #fff; }
.btn-sm { padding: 5px 10px; font-size: 11px; }
.btn .ic { width: 14px; height: 14px; }

.content { padding: 24px; flex: 1; overflow-x: auto; }

.page-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  margin-bottom: 22px;
  gap: 16px;
  flex-wrap: wrap;
}
.page-head h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -.02em;
  color: var(--navy);
}
.page-head p { margin: 4px 0 0; color: var(--ink-muted); font-size: 13px; }
.page-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* CARDS */
.card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}
.card-pad { padding: 18px; }
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line-soft);
}
.card-head h3 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: -.01em; }
.card-head .sub { font-size: 11px; color: var(--ink-faint); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }

/* KPI Strip */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}
.kpi {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  position: relative;
  overflow: hidden;
}
.kpi::before {
  content: "";
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--gold);
}
.kpi-label { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; }
.kpi-value { font-size: 26px; font-weight: 800; letter-spacing: -.02em; color: var(--navy); margin-top: 6px; font-variant-numeric: tabular-nums; }
.kpi-delta { font-size: 11px; font-weight: 700; margin-top: 4px; }
.kpi-delta.up { color: var(--green); }
.kpi-delta.down { color: var(--red); }
.kpi-icon {
  position: absolute; right: 14px; top: 14px;
  width: 30px; height: 30px;
  background: var(--cream-2);
  border-radius: 8px;
  display: grid; place-items: center;
  color: var(--navy);
}
.kpi-icon svg { width: 16px; height: 16px; }

/* PIPELINE / KANBAN */
.kanban-wrap {
  display: flex; gap: 14px;
  overflow-x: auto;
  padding-bottom: 16px;
  min-height: 600px;
}
.column {
  width: 290px;
  flex-shrink: 0;
  background: var(--cream-2);
  border-radius: var(--radius);
  border: 1px solid var(--line);
  display: flex; flex-direction: column;
}
.col-head {
  padding: 12px 14px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--line);
}
.col-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase;
  color: var(--navy);
}
.col-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--gold); }
.col-count {
  background: #fff;
  border: 1px solid var(--line);
  font-size: 10px; font-weight: 800;
  padding: 2px 7px;
  border-radius: 999px;
  color: var(--navy);
}
.col-total {
  font-size: 10px; color: var(--ink-faint); font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  margin-left: 8px;
}
.col-body {
  padding: 10px;
  flex: 1;
  overflow-y: auto;
  display: flex; flex-direction: column; gap: 10px;
  min-height: 200px;
}
.col-body.drag-over { background: rgba(197,160,89,.08); }

.job-card {
  background: #fff;
  border-radius: var(--radius);
  padding: 12px 14px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  cursor: grab;
  transition: all .15s ease;
  position: relative;
}
.job-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); border-color: var(--gold-soft); }
.job-card:active { cursor: grabbing; }
.job-card.dragging { opacity: 0.4; }
.job-card.priority-Urgent { border-left: 4px solid var(--red); }
.job-card.priority-High { border-left: 4px solid var(--amber); }
.job-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.job-card-name { font-weight: 700; font-size: 13px; color: var(--navy); line-height: 1.25; }
.job-card-value {
  font-size: 12px; font-weight: 800;
  background: var(--cream-2);
  padding: 4px 8px;
  border-radius: 6px;
  font-variant-numeric: tabular-nums;
  color: var(--navy);
  white-space: nowrap;
}
.job-card-meta { font-size: 11px; color: var(--ink-muted); display: flex; flex-direction: column; gap: 4px; }
.job-card-meta .row { display: flex; align-items: center; gap: 6px; }
.job-card-meta svg { width: 11px; height: 11px; color: var(--ink-faint); flex-shrink: 0; }
.job-tags { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
.job-tag {
  font-size: 9px; font-weight: 700;
  padding: 2px 7px;
  border-radius: 4px;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.job-tag.town { background: rgba(197,160,89,.14); color: var(--gold-deep); }
.job-tag.service { background: var(--blue-soft); color: var(--blue); }
.job-tag.crew { background: var(--purple-soft); color: var(--purple); }
.job-tag.urgent { background: var(--red-soft); color: var(--red); }
.job-tag.scheduled { background: var(--green-soft); color: var(--green); }

.job-progress {
  margin-top: 8px;
  height: 4px;
  background: var(--line-soft);
  border-radius: 999px;
  overflow: hidden;
}
.job-progress-bar { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-soft)); border-radius: 999px; }

.empty-col {
  padding: 30px 10px;
  text-align: center;
  color: var(--ink-faint);
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  border: 2px dashed var(--line);
  border-radius: var(--radius);
  margin: 8px;
}

/* MODAL */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(15,23,42,.5);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 20px;
  animation: fadeIn .15s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: #fff;
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 920px;
  max-height: calc(100vh - 40px);
  overflow: hidden;
  box-shadow: var(--shadow-xl);
  display: flex; flex-direction: column;
  animation: slideUp .2s ease;
}
@keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-sm { max-width: 540px; }
.modal-md { max-width: 720px; }
.modal-lg { max-width: 1100px; }
.modal-head {
  background: var(--navy);
  color: #fff;
  padding: 18px 22px;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.modal-head h2 { margin: 0; font-size: 17px; font-weight: 700; }
.modal-head .sub { font-size: 10px; letter-spacing: .18em; color: var(--gold); font-weight: 700; text-transform: uppercase; margin-top: 3px; }
.modal-close {
  width: 32px; height: 32px; border-radius: 8px;
  background: rgba(255,255,255,.08); color: #fff;
  display: grid; place-items: center;
}
.modal-close:hover { background: rgba(255,255,255,.18); }
.modal-body { padding: 22px; overflow-y: auto; flex: 1; }
.modal-foot { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-shrink: 0; }

/* FORMS */
.form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label, .micro-label {
  font-size: 10px; letter-spacing: .15em; text-transform: uppercase;
  color: var(--ink-muted); font-weight: 700;
}
.field input, .field select, .field textarea {
  padding: 9px 12px;
  background: var(--cream);
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 13px;
  transition: all .15s ease;
}
.field input:focus, .field select:focus, .field textarea:focus {
  background: #fff;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(197,160,89,.12);
}
.field textarea { min-height: 80px; resize: vertical; }

/* TABS inside modal */
.tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 18px;
  overflow-x: auto;
}
.tab {
  padding: 10px 14px;
  font-size: 11px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-muted);
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  display: flex; align-items: center; gap: 6px;
}
.tab:hover { color: var(--navy); }
.tab.active { color: var(--navy); border-bottom-color: var(--gold); }
.tab svg { width: 13px; height: 13px; }

/* JOB DETAIL */
.detail-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 22px; }
.detail-section { margin-bottom: 22px; }
.detail-section h3 {
  font-size: 11px; font-weight: 800;
  color: var(--navy); letter-spacing: .15em; text-transform: uppercase;
  margin: 0 0 12px;
  display: flex; align-items: center; gap: 8px;
}
.detail-section h3 svg { width: 14px; height: 14px; color: var(--gold); }

.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 16px; background: var(--cream); border-radius: var(--radius); border: 1px solid var(--line-soft); }
.info-item { display: flex; flex-direction: column; gap: 4px; }
.info-label { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; }
.info-value { font-size: 13px; color: var(--ink); font-weight: 600; }

.timeline {
  position: relative;
  padding-left: 22px;
}
.timeline::before {
  content: "";
  position: absolute; left: 7px; top: 6px; bottom: 6px;
  width: 1px; background: var(--line);
}
.timeline-item { position: relative; padding-bottom: 14px; }
.timeline-item::before {
  content: "";
  position: absolute; left: -19px; top: 4px;
  width: 9px; height: 9px;
  background: var(--gold); border-radius: 999px;
  border: 2px solid #fff;
  box-shadow: 0 0 0 1px var(--line);
}
.timeline-item.completed::before { background: var(--green); }
.timeline-item.system::before { background: var(--ink-faint); }
.timeline-when { font-size: 10px; color: var(--ink-faint); letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
.timeline-what { font-size: 12px; color: var(--ink); margin-top: 2px; }

/* TASKS */
.task-list { display: flex; flex-direction: column; gap: 6px; }
.task-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  background: var(--cream);
  border-radius: 8px;
  border: 1px solid var(--line-soft);
}
.task-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--gold); cursor: pointer; }
.task-text { flex: 1; font-size: 13px; }
.task-row.done .task-text { text-decoration: line-through; color: var(--ink-faint); }
.task-meta { font-size: 10px; color: var(--ink-faint); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }

/* CALENDAR */
.calendar {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.cal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
}
.cal-nav { display: flex; gap: 6px; align-items: center; }
.cal-month { font-size: 16px; font-weight: 700; color: var(--navy); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-dow {
  background: var(--cream-2);
  padding: 8px 10px;
  font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-muted);
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  text-align: left;
}
.cal-dow:last-child { border-right: none; }
.cal-day {
  min-height: 110px;
  padding: 8px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  position: relative;
}
.cal-day:nth-child(7n) { border-right: none; }
.cal-day.outside { background: var(--cream-2); opacity: 0.6; }
.cal-day.today { background: rgba(197,160,89,.08); }
.cal-day.today .cal-num { color: var(--gold-deep); }
.cal-num { font-size: 12px; font-weight: 700; color: var(--ink-muted); }
.cal-event {
  display: block;
  margin-top: 4px;
  padding: 3px 6px;
  background: var(--navy);
  color: #fff;
  border-radius: 4px;
  font-size: 10px; font-weight: 700;
  cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cal-event.scheduled { background: var(--green); }
.cal-event.installation { background: var(--gold); color: var(--navy); }
.cal-event.followup { background: var(--blue); }

/* TABLES */
.tbl {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.tbl thead th {
  background: var(--cream-2);
  padding: 12px 16px;
  font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-muted);
  text-align: left;
  border-bottom: 1px solid var(--line);
}
.tbl tbody td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--line-soft);
  font-size: 13px;
}
.tbl tbody tr:hover { background: var(--cream); }
.tbl tbody tr:last-child td { border-bottom: none; }

/* INVOICES & ESTIMATES */
.doc-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  display: flex; align-items: center; gap: 14px;
  transition: all .15s ease;
}
.doc-card:hover { border-color: var(--gold); box-shadow: var(--shadow-md); }
.doc-icon {
  width: 44px; height: 44px;
  background: var(--cream-2);
  border-radius: 8px;
  display: grid; place-items: center;
  color: var(--navy);
}
.doc-info { flex: 1; min-width: 0; }
.doc-title { font-weight: 700; font-size: 14px; color: var(--navy); }
.doc-sub { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }
.doc-amount { font-size: 16px; font-weight: 800; color: var(--navy); font-variant-numeric: tabular-nums; }
.doc-status {
  font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
  padding: 3px 8px; border-radius: 4px;
}
.doc-status.draft { background: var(--cream-2); color: var(--ink-muted); }
.doc-status.sent { background: var(--blue-soft); color: var(--blue); }
.doc-status.paid { background: var(--green-soft); color: var(--green); }
.doc-status.overdue { background: var(--red-soft); color: var(--red); }

/* CHARTS */
.chart-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
}
.chart-card h3 { margin: 0 0 14px; font-size: 13px; font-weight: 700; }
.chart-box { position: relative; height: 280px; }

/* CHIPS / FILTERS */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  padding: 6px 11px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 11px; font-weight: 700;
  color: var(--ink-muted);
  display: inline-flex; align-items: center; gap: 5px;
}
.chip:hover { border-color: var(--gold); color: var(--navy); }
.chip.active { background: var(--navy); color: #fff; border-color: var(--navy); }

/* MATERIALS */
.material-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
}
.stock-bar {
  height: 6px;
  background: var(--line-soft);
  border-radius: 999px;
  overflow: hidden;
  margin-top: 8px;
}
.stock-fill { height: 100%; background: var(--green); border-radius: 999px; }
.stock-fill.low { background: var(--amber); }
.stock-fill.critical { background: var(--red); }

/* CREW */
.crew-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  display: flex; align-items: center; gap: 12px;
}
.crew-avatar {
  width: 44px; height: 44px;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--navy), var(--navy-soft));
  color: var(--gold);
  display: grid; place-items: center;
  font-weight: 800; font-size: 14px;
}

/* MAP */
.map-canvas {
  width: 100%;
  aspect-ratio: 5 / 3;
  max-height: 640px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  position: relative;
  overflow: hidden;
  background: #eff6ff;
  box-shadow: inset 0 1px 3px rgba(15,23,42,.06);
}
.map-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
.map-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.map-overlay > * { pointer-events: auto; }
.map-legend {
  position: absolute;
  bottom: 14px;
  right: 14px;
  background: rgba(255,255,255,.95);
  backdrop-filter: blur(6px);
  padding: 10px 14px;
  border-radius: 10px;
  box-shadow: var(--shadow-md);
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  color: var(--navy);
}
.map-legend .row { display: flex; align-items: center; gap: 8px; }
.map-legend .swatch {
  width: 12px; height: 12px;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  border: 2px solid #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
}
.map-title-card {
  position: absolute;
  top: 14px; left: 14px;
  background: rgba(255,255,255,.95);
  backdrop-filter: blur(6px);
  padding: 10px 14px;
  border-radius: 10px;
  box-shadow: var(--shadow-md);
  border: 1px solid var(--line);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--navy);
  display: flex;
  align-items: center;
  gap: 8px;
}
.map-title-card .dot { width: 6px; height: 6px; background: var(--gold); border-radius: 50%; }
.map-pin {
  position: absolute;
  transform: translate(-50%, -100%);
  display: flex; flex-direction: column; align-items: center;
  cursor: pointer;
  transition: transform .15s ease;
  z-index: 5;
}
.map-pin:hover { transform: translate(-50%, -106%) scale(1.12); z-index: 10; }
.map-pin-dot {
  width: 26px; height: 26px;
  background: var(--gold);
  border: 2.5px solid #fff;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg);
  box-shadow: 0 4px 8px rgba(15,23,42,.25), 0 0 0 1px rgba(15,23,42,.06);
  display: grid; place-items: center;
  color: var(--navy);
  font-weight: 800;
  font-size: 11px;
}
.map-pin-dot span { transform: rotate(45deg); }
.map-pin.lead .map-pin-dot { background: var(--blue); color: #fff; }
.map-pin.completed .map-pin-dot { background: var(--green); color: #fff; }
.map-pin.installation .map-pin-dot { background: var(--red); color: #fff; }
.map-pin.scheduled .map-pin-dot { background: #7c3aed; color: #fff; }

/* SCROLLBARS */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(15,23,42,.15); border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: rgba(15,23,42,.25); }

/* TOAST */
.toast-stack {
  position: fixed; bottom: 22px; right: 22px;
  z-index: 200;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  background: var(--navy);
  color: #fff;
  padding: 11px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: var(--shadow-xl);
  display: flex; align-items: center; gap: 10px;
  animation: toastIn .2s ease;
}
.toast.success { background: var(--green); }
.toast.error { background: var(--red); }
.toast svg { width: 16px; height: 16px; }
@keyframes toastIn { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* AUTH SCREEN */
.auth-screen {
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at top, rgba(197,160,89,.18), transparent 60%),
    radial-gradient(ellipse at bottom right, rgba(36,59,102,.6), transparent 60%),
    var(--navy);
  display: grid; place-items: center;
  padding: 20px;
  z-index: 1000;
  animation: fadeIn .25s ease;
}
.auth-shell {
  width: 100%;
  max-width: 460px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.auth-brand {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  margin-bottom: 8px;
}
.auth-brand-mark {
  width: 56px; height: 56px;
  background: var(--gold);
  color: var(--navy);
  border-radius: 12px;
  display: grid; place-items: center;
  font-weight: 800; font-style: italic; font-size: 24px;
  box-shadow: 0 10px 24px rgba(197,160,89,.35);
}
.auth-brand-name { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -.01em; line-height: 1.05; }
.auth-brand-sub { font-size: 10px; letter-spacing: .25em; text-transform: uppercase; color: var(--gold); font-weight: 700; margin-top: 4px; }

.auth-card {
  background: #fff;
  border-radius: var(--radius-lg);
  padding: 32px;
  width: 100%;
  box-shadow: var(--shadow-xl);
}
.auth-card h2 {
  margin: 0 0 4px;
  font-size: 18px;
  color: var(--navy);
  text-align: center;
  letter-spacing: -.01em;
}
.auth-card .auth-sub {
  color: var(--ink-muted); font-size: 12px;
  text-align: center;
  margin: 0 0 22px;
}

.role-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
}
.role-btn {
  border: 2px solid var(--line);
  border-radius: 10px;
  padding: 14px 12px;
  background: var(--cream);
  text-align: center;
  transition: all .15s ease;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.role-btn:hover { border-color: var(--gold-soft); background: #fff; }
.role-btn.active {
  border-color: var(--gold);
  background: linear-gradient(180deg, #fff, rgba(197,160,89,.08));
  box-shadow: 0 4px 16px rgba(197,160,89,.18);
}
.role-btn .role-icon {
  width: 40px; height: 40px;
  background: var(--cream-2);
  border-radius: 50%;
  display: grid; place-items: center;
  color: var(--navy);
}
.role-btn.active .role-icon { background: var(--gold); color: var(--navy); }
.role-btn .role-icon svg { width: 20px; height: 20px; }
.role-btn .role-label { font-weight: 700; font-size: 13px; color: var(--navy); }
.role-btn .role-desc { font-size: 10px; letter-spacing: .12em; color: var(--ink-faint); text-transform: uppercase; font-weight: 700; }

.password-field {
  position: relative;
  margin-bottom: 14px;
}
.password-field input {
  width: 100%;
  padding: 12px 44px 12px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--cream);
  font-size: 14px;
  font-family: inherit;
  letter-spacing: .04em;
}
.password-field input:focus {
  background: #fff;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(197,160,89,.15);
}
.password-toggle {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  width: 30px; height: 30px;
  border-radius: 6px;
  display: grid; place-items: center;
  color: var(--ink-faint);
}
.password-toggle:hover { background: var(--cream-2); color: var(--navy); }
.password-toggle svg { width: 16px; height: 16px; }

.auth-error {
  padding: 10px 14px;
  background: var(--red-soft);
  border: 1px solid #fecaca;
  border-radius: 8px;
  color: var(--red);
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.auth-error svg { width: 14px; height: 14px; flex-shrink: 0; }
.auth-submit {
  width: 100%;
  background: var(--navy);
  color: #fff;
  padding: 13px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: .08em;
  text-transform: uppercase;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: all .15s ease;
}
.auth-submit:hover { background: var(--navy-deep); transform: translateY(-1px); box-shadow: var(--shadow-lg); }
.auth-submit:disabled { opacity: .5; cursor: wait; transform: none; }

.auth-foot {
  text-align: center;
  margin-top: 16px;
  font-size: 10px;
  color: rgba(255,255,255,.45);
  letter-spacing: .12em;
  text-transform: uppercase;
  font-weight: 700;
}
.auth-foot strong { color: var(--gold); }

/* USER MANAGEMENT */
.session-card {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 14px;
  align-items: center;
  padding: 14px;
  background: linear-gradient(180deg, var(--cream), #fff);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.session-status {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 4px rgba(5,150,105,.18);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 4px rgba(5,150,105,.18); }
  50% { box-shadow: 0 0 0 8px rgba(5,150,105,.05); }
}
.detail-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.detail-table td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--line-soft);
}
.detail-table td:first-child {
  width: 35%;
  font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-faint); font-weight: 700;
}
.detail-table td:last-child {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--ink);
  font-weight: 600;
  word-break: break-all;
}
.detail-table tr:last-child td { border-bottom: none; }

.login-row-success { color: var(--green); font-weight: 700; }
.login-row-fail { color: var(--red); font-weight: 700; }
.role-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
}
.role-pill.Admin { background: var(--navy); color: var(--gold); }
.role-pill.Sales { background: var(--gold-soft); color: var(--navy); }

/* FOLLOW UP & ACTIVITY */
.activity-list { display: flex; flex-direction: column; gap: 10px; }
.activity-row {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 10px;
  background: var(--cream);
  border-radius: 8px;
  border: 1px solid var(--line-soft);
}
.activity-icon {
  width: 30px; height: 30px;
  border-radius: 8px;
  background: #fff;
  border: 1px solid var(--line);
  display: grid; place-items: center;
  flex-shrink: 0;
  color: var(--navy);
}
.activity-icon svg { width: 14px; height: 14px; }
.activity-content { flex: 1; }
.activity-title { font-size: 13px; font-weight: 600; color: var(--ink); }
.activity-when { font-size: 10px; color: var(--ink-faint); letter-spacing: .1em; text-transform: uppercase; font-weight: 700; margin-top: 2px; }

/* BADGE PRIORITY */
.priority-pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
}
.priority-pill.Urgent { background: var(--red-soft); color: var(--red); }
.priority-pill.High { background: var(--amber-soft); color: var(--amber); }
.priority-pill.Medium { background: var(--blue-soft); color: var(--blue); }
.priority-pill.Low { background: var(--cream-2); color: var(--ink-muted); }

/* ===== HAMBURGER (mobile only) ===== */
.hamburger {
  display: none;
  width: 38px; height: 38px;
  border-radius: 8px;
  background: var(--cream);
  border: 1px solid var(--line);
  align-items: center; justify-content: center;
  color: var(--navy);
  cursor: pointer;
  flex-shrink: 0;
}
.hamburger:active { background: var(--cream-2); }
.hamburger svg { width: 20px; height: 20px; }
.sidebar-backdrop {
  display: none;
  position: fixed; inset: 0;
  background: rgba(15,23,42,.5);
  backdrop-filter: blur(2px);
  z-index: 80;
  opacity: 0;
  transition: opacity .2s ease;
}
.sidebar-backdrop.show { display: block; opacity: 1; }

/* ===== TABLET (≤1024px) ===== */
@media (max-width: 1024px) {
  .app { grid-template-columns: 200px 1fr; }
  .content { padding: 18px; }
  .kpi-grid { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .column { width: 270px; }
}

/* ===== PHONE (≤700px) ===== */
@media (max-width: 700px) {
  /* Layout: single column, sidebar becomes off-canvas drawer */
  .app { grid-template-columns: 1fr; }

  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 260px;
    z-index: 90;
    transform: translateX(-100%);
    transition: transform .25s ease;
    box-shadow: 4px 0 20px rgba(0,0,0,.25);
    padding: 22px 14px;
  }
  .sidebar.open { transform: translateX(0); }
  /* Restore full sidebar labels when drawer is open */
  .brand-name, .brand-sub, .nav-item span:not(.ic),
  .user-name, .user-role, .nav-section { display: block !important; }
  .nav-item { justify-content: flex-start !important; padding: 12px !important; }

  /* Hamburger visible only at this size */
  .hamburger { display: inline-flex; }

  /* Topbar adjustments */
  .topbar {
    padding: 10px 12px;
    gap: 8px;
    flex-wrap: nowrap;
  }
  .topbar > div:first-child { min-width: 0; flex-shrink: 1; overflow: hidden; }
  .topbar h2 { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .crumbs { font-size: 8px; }

  /* Hide search on phone (rely on filter chips inside views) */
  .search-box { display: none; }

  /* Topbar buttons: icon-only */
  .topbar .btn span { display: none; }
  .topbar .btn { padding: 9px 11px; min-width: 38px; justify-content: center; }
  .topbar .btn .ic { width: 16px; height: 16px; margin: 0; }

  /* Content padding tighter */
  .content { padding: 14px; }

  /* Page heading stacks */
  .page-head {
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
  }
  .page-head h1 { font-size: 20px; }
  .page-head p { font-size: 12px; }
  .page-actions { flex-wrap: wrap; gap: 6px; }
  .page-actions .btn { flex: 1; min-width: 0; justify-content: center; }

  /* KPI grid: 2 columns */
  .kpi-grid { grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .kpi { padding: 12px; }
  .kpi-value { font-size: 20px; }
  .kpi-label { font-size: 9px; letter-spacing: .12em; }
  .kpi-delta { font-size: 10px; }
  .kpi-icon { width: 26px; height: 26px; }
  .kpi-icon svg { width: 14px; height: 14px; }

  /* Dashboard 2-column chart row -> stacked */
  .content > div[style*="grid-template-columns:2fr 1fr"],
  .content > div[style*="grid-template-columns:1fr 1fr"],
  .content > div[style*="grid-template-columns:1.4fr 1fr"] {
    grid-template-columns: 1fr !important;
  }

  /* Pipeline kanban: snap-scroll for swipeability */
  .kanban-wrap {
    gap: 12px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    margin: 0 -14px;
    padding: 0 14px 16px;
  }
  .column {
    width: calc(100vw - 56px);
    max-width: 320px;
    scroll-snap-align: center;
    flex-shrink: 0;
  }

  /* Modals: full-screen on mobile */
  .modal-backdrop { padding: 0; }
  .modal {
    max-width: 100vw !important;
    max-height: 100vh !important;
    width: 100vw !important;
    height: 100vh !important;
    border-radius: 0 !important;
  }
  .modal-head { padding: 14px 16px; }
  .modal-head h2 { font-size: 16px; }
  .modal-body { padding: 16px; }
  .modal-foot { padding: 12px 16px; flex-direction: column-reverse; }
  .modal-foot .btn { width: 100%; justify-content: center; }

  /* Job detail: stack the two-column grid */
  .detail-grid { grid-template-columns: 1fr !important; gap: 16px; }
  .info-grid { grid-template-columns: 1fr !important; gap: 10px; padding: 12px; }

  /* Forms: single column */
  .form-grid { grid-template-columns: 1fr !important; gap: 10px; }
  .field input, .field select, .field textarea {
    font-size: 16px; /* prevents iOS auto-zoom on focus */
    padding: 11px 12px;
  }

  /* Tables: horizontal scroll wrapper */
  .tbl {
    display: block;
    overflow-x: auto;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
  }
  .tbl thead, .tbl tbody, .tbl tr { display: table; width: 100%; table-layout: fixed; }
  .tbl thead th, .tbl tbody td { font-size: 12px; padding: 10px 12px; }

  /* Calendar: tighter cells */
  .cal-day { min-height: 64px; padding: 4px; }
  .cal-num { font-size: 10px; }
  .cal-event { font-size: 8px; padding: 2px 4px; margin-top: 2px; }
  .cal-dow { padding: 6px 4px; font-size: 8px; letter-spacing: .08em; }
  .cal-month { font-size: 14px; }

  /* Job map: shorter on mobile */
  .map-canvas { aspect-ratio: 4 / 3; }
  .map-pin-dot { width: 22px; height: 22px; font-size: 10px; }
  .map-legend { font-size: 9px; padding: 8px 10px; bottom: 10px; right: 10px; }
  .map-title-card { font-size: 9px; padding: 7px 10px; top: 10px; left: 10px; }

  /* Job cards: tighter */
  .job-card { padding: 11px 12px; }
  .job-card-name { font-size: 13px; }
  .job-card-value { font-size: 11px; padding: 3px 7px; }

  /* Auth screen: tighter padding */
  .auth-card { padding: 24px 18px; }
  .auth-card h2 { font-size: 17px; }
  .role-btn { padding: 12px 8px; }
  .role-btn .role-icon { width: 36px; height: 36px; }
  .role-btn .role-label { font-size: 12px; }
  .role-btn .role-desc { font-size: 9px; }

  /* Estimate scanner review modal: stack image + form */
  .modal-body > div[style*="grid-template-columns:1fr 1.2fr"] {
    grid-template-columns: 1fr !important;
    gap: 14px !important;
  }

const Cloud = {
  ready: false,

  unsubLog: null,
  saveTimer: null,

  startSubscriptions() {
    if (this.unsubMain) this.unsubMain();
    if (this.unsubLog) this.unsubLog();

    this.unsubMain = fbDb.doc('appState/main').onSnapshot(snap => {
      if (snap.exists && snap.metadata.hasPendingWrites === false) {
        const data = snap.data();
        this.applyingRemote = true;
        try {
          if (Array.isArray(data.jobs)) State.jobs = data.jobs;
          if (Array.isArray(data.customers)) State.customers = data.customers;

          if (Array.isArray(data.materials)) State.materials = data.materials;
          if (Array.isArray(data.invoices)) State.invoices = data.invoices;
          if (Array.isArray(data.activity)) State.activity = data.activity;
          if (data.settings) State.settings = { ...State.settings, ...data.settings };

          this.applyingRemote = false;
        }
        // Cache locally for fast cold-loads
        this.cacheLocal();
        if (App && App.bootDone) {
          App.renderNav();

        .onSnapshot(snap => {
          State.loginLog = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          if (App && App.bootDone) App.render();
        }, err => console.warn('Login log subscription:', err.code));
    }
  },

  stopSubscriptions() {
    if (this.unsubMain) { this.unsubMain(); this.unsubMain = null; }
    if (this.unsubLog) { this.unsubLog(); this.unsubLog = null; }
  },

  // Debounced save — coalesces rapid edits (drag-drop, task toggles) into one write
  scheduleSave() {
    if (this.applyingRemote) return; // don't echo remote changes back
    clearTimeout(this.saveTimer);
    this.saveTimer = setTimeout(() => this.saveNow(), 350);
  },

  async saveNow() {
    if (!fbAuth.currentUser) return;
    this.saving = true;
    try {
      await fbDb.doc('appState/main').set({
        jobs: State.jobs,
        customers: State.customers,
        crew: State.crew,
        materials: State.materials,
        invoices: State.invoices,
        activity: State.activity.slice(-150),
        settings: State.settings,
        _updatedAt: FieldValue.serverTimestamp(),
        _updatedBy: State.auth.role || 'unknown',
      }, { merge: true });
      this.cacheLocal();
    } catch (e) {
      console.error('Save failed:', e);
      toast('Cloud save failed — will retry: ' + (e.message || ''), 'error');
    } finally {
      this.saving = false;
    }
  },

  // Append a login event to Firestore (and locally)
  async logLogin(entry) {
    try {
      await fbDb.collection('loginLog').add({
        ...entry,
        timestamp: entry.timestamp || Date.now(),
        _ts: FieldValue.serverTimestamp(),
      });
    } catch (e) {
      console.warn('Login log write failed:', e.code, e.message);
    }
  },

  // Cache the last remote state to localStorage so cold loads paint instantly
  cacheLocal() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        jobs: State.jobs,
        customers: State.customers,
        crew: State.crew,
        materials: State.materials,
        invoices: State.invoices,
        activity: State.activity.slice(-150),
        settings: State.settings,
        _cachedAt: Date.now(),
      }));
    } catch {}
  },

  // First-time bootstrap: if appState/main doesn't exist, seed it
  async seedIfEmpty() {
    try {
      const doc = await fbDb.doc('appState/main').get();
      if (!doc.exists) {
        seed(); // populates State arrays
        await this.saveNow();
        console.log('Seeded fresh database with starter data.');
      }
    } catch (e) {
      console.warn('Seed check failed:', e);
    }
  },
};

// Replace localStorage-based persistence with cloud sync.
// `persist()` is called all over the existing code — we rewire it here.
function persist() { Cloud.scheduleSave(); }

function hydrate() {
  // Paint instantly from local cache while we wait for Firestore
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (Array.isArray(data.jobs) && data.jobs.length) State.jobs = data.jobs;
      if (Array.isArray(data.customers)) State.customers = data.customers;
      if (Array.isArray(data.crew)) State.crew = data.crew;
      if (Array.isArray(data.materials)) State.materials = data.materials;
      if (Array.isArray(data.invoices)) State.invoices = data.invoices;
      if (Array.isArray(data.activity)) State.activity = data.activity;
      if (data.settings) State.settings = { ...State.settings, ...data.settings };
    }
  } catch (e) { console.warn('Local cache hydrate failed:', e); }
}

/* ========== UTILS ========== */
const fmt = {
  money: n => '$' + Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 0 }),
  moneyDec: n => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
  date: ts => ts ? new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—',
  dateShort: ts => ts ? new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—',
  time: ts => ts ? new Date(ts).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : '—',
  rel: ts => {
    if (!ts) return '—';
    const d = (Date.now() - ts) / 1000;
    if (d < 60) return 'just now';
    if (d < 3600) return Math.floor(d / 60) + 'm ago';
    if (d < 86400) return Math.floor(d / 3600) + 'h ago';
    if (d < 86400 * 7) return Math.floor(d / 86400) + 'd ago';
    return fmt.dateShort(ts);
  },
  phone: v => {
    const x = (v || '').replace(/\D/g, '').slice(0, 10);
    if (x.length < 4) return x;
    if (x.length < 7) return `(${x.slice(0,3)}) ${x.slice(3)}`;
    return `(${x.slice(0,3)}) ${x.slice(3,6)}-${x.slice(6)}`;
  }
};

function uid(prefix = 'id') {
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function escHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function logActivity(type, text) {
  State.activity.unshift({ ts: Date.now(), type, text, user: State.settings.user.name });
  State.activity = State.activity.slice(0, 200);
  persist();
}

function toast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = 'toast ' + (type === 'error' ? 'error' : type === 'info' ? '' : 'success');
  t.innerHTML = (type === 'error' ? ICON.alert : ICON.check) + '<span>' + escHtml(msg) + '</span>';
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => { t.style.opacity = 0; setTimeout(() => t.remove(), 200); }, 2500);
}

/* ========== AUTH & ANALYTICS ========== */
const Auth = {
  // Parse User Agent into friendly browser/OS strings
  parseUA(ua) {
    ua = ua || navigator.userAgent || '';
    let browser = 'Unknown', browserVersion = '';
    let os = 'Unknown', osVersion = '';
    let device = 'Desktop';

    // Browser detection
    if (/Edg\//.test(ua)) { browser = 'Edge'; browserVersion = (ua.match(/Edg\/([\d.]+)/) || [])[1] || ''; }
    else if (/OPR\//.test(ua) || /Opera/.test(ua)) { browser = 'Opera'; browserVersion = (ua.match(/(?:OPR|Opera)\/([\d.]+)/) || [])[1] || ''; }
    else if (/Chrome\//.test(ua) && !/Chromium/.test(ua)) { browser = 'Chrome'; browserVersion = (ua.match(/Chrome\/([\d.]+)/) || [])[1] || ''; }
    else if (/Firefox\//.test(ua)) { browser = 'Firefox'; browserVersion = (ua.match(/Firefox\/([\d.]+)/) || [])[1] || ''; }
    else if (/Safari\//.test(ua) && /Version\//.test(ua)) { browser = 'Safari'; browserVersion = (ua.match(/Version\/([\d.]+)/) || [])[1] || ''; }

    // OS detection
    if (/Windows NT 10/.test(ua)) { os = 'Windows'; osVersion = '10/11'; }
    else if (/Windows NT 6\.3/.test(ua)) { os = 'Windows'; osVersion = '8.1'; }
    else if (/Windows NT 6\.2/.test(ua)) { os = 'Windows'; osVersion = '8'; }
    else if (/Windows NT 6\.1/.test(ua)) { os = 'Windows'; osVersion = '7'; }
    else if (/Windows/.test(ua)) { os = 'Windows'; }
    else if (/Mac OS X ([\d_]+)/.test(ua)) {
      os = 'macOS';
      const v = (ua.match(/Mac OS X ([\d_]+)/) || [])[1] || '';
      osVersion = v.replace(/_/g, '.');
    }
    else if (/Android ([\d.]+)/.test(ua)) { os = 'Android'; osVersion = (ua.match(/Android ([\d.]+)/) || [])[1] || ''; device = 'Mobile'; }
    else if (/iPhone OS ([\d_]+)/.test(ua)) { os = 'iOS'; osVersion = (ua.match(/iPhone OS ([\d_]+)/) || [])[1].replace(/_/g, '.') || ''; device = 'iPhone'; }
    else if (/iPad/.test(ua)) { os = 'iPadOS'; device = 'iPad'; }
    else if (/Linux/.test(ua)) { os = 'Linux'; }
    else if (/CrOS/.test(ua)) { os = 'ChromeOS'; }

    if (device === 'Desktop' && /Mobi|Android/.test(ua)) device = 'Mobile';

    return { browser, browserVersion: (browserVersion.split('.')[0] || ''), os, osVersion, device };
  },

  // Attempt to capture local IP via WebRTC (modern browsers may obfuscate via mDNS)
  getLocalIPViaWebRTC() {
    return new Promise((resolve) => {
      try {
        if (!window.RTCPeerConnection) { resolve(null); return; }
        const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
        const ips = new Set();
        pc.createDataChannel('');
        pc.createOffer().then(offer => pc.setLocalDescription(offer)).catch(() => {});
        const done = () => { try { pc.close(); } catch{} resolve(ips.size ? Array.from(ips).join(', ') : null); };
        pc.onicecandidate = (e) => {
          if (!e.candidate) { done(); return; }
          const m = e.candidate.candidate.match(/(\d+\.\d+\.\d+\.\d+|[a-f0-9:]+:[a-f0-9:]+)/);
          if (m) ips.add(m[1]);
        };
        setTimeout(done, 1500);
      } catch { resolve(null); }
    });
  },

  // Try to fetch public IP (will fail in sandboxed artifact - graceful degradation)
  getPublicIP() {
    return new Promise((resolve) => {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 1500);
      fetch('https://api.ipify.org?format=json', { signal: controller.signal })
        .then(r => r.json())
        .then(d => { clearTimeout(timer); resolve(d.ip || null); })
        .catch(() => { clearTimeout(timer); resolve(null); });
    });
  },

  // Capture comprehensive device & connection analytics
  async captureAnalytics() {
    const nav = navigator;
    const scr = window.screen || {};
    const conn = nav.connection || nav.mozConnection || nav.webkitConnection || {};
    const ua = nav.userAgent || '';
    const parsed = this.parseUA(ua);

    const [localIP, publicIP] = await Promise.all([
      this.getLocalIPViaWebRTC(),
      this.getPublicIP(),
    ]);

    return {
      // Network
      publicIP: publicIP || 'Unavailable (sandboxed)',
      localIP: localIP || 'Obfuscated by browser',
      online: nav.onLine,
      connectionType: conn.effectiveType || 'unknown',
      downlink: conn.downlink ? conn.downlink + ' Mbps' : 'unknown',
      rtt: conn.rtt ? conn.rtt + ' ms' : 'unknown',

      // Browser & OS
      browser: parsed.browser,
      browserVersion: parsed.browserVersion,
      os: parsed.os,
      osVersion: parsed.osVersion,
      device: parsed.device,
      userAgent: ua,
      vendor: nav.vendor || '',
      platform: nav.platform || '',

      // Display
      screenResolution: `${scr.width || '?'} × ${scr.height || '?'}`,
      windowSize: `${window.innerWidth} × ${window.innerHeight}`,
      colorDepth: (scr.colorDepth || '?') + '-bit',
      pixelRatio: (window.devicePixelRatio || 1).toFixed(2),

      // Locale
      language: nav.language || 'unknown',
      languages: (nav.languages || []).join(', '),
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'unknown',
      timezoneOffset: -new Date().getTimezoneOffset() / 60,

      // Hardware
      cpuCores: nav.hardwareConcurrency || 'unknown',
      deviceMemory: nav.deviceMemory ? nav.deviceMemory + ' GB' : 'unknown',
      touchSupport: nav.maxTouchPoints > 0,
      maxTouchPoints: nav.maxTouchPoints || 0,

      // Misc
      cookiesEnabled: nav.cookieEnabled,
      doNotTrack: nav.doNotTrack === '1',
      referrer: document.referrer || 'Direct',
      pageURL: location.href,
    };
  },

  // Generate unique session ID
  newSessionId() {
    return 'sess_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
  },

  // Attempt login: posts to /api/login (Vercel function) which verifies the
  // password against env vars and returns a Firebase custom token.
  async attemptLogin(role, password) {
    const analytics = await this.captureAnalytics();
    const sessionId = this.newSessionId();
    const baseEntry = {
      sessionId,
      role: role === 'admin' ? 'Admin' : 'Sales Team',
      roleKey: role,
      timestamp: Date.now(),
      logoutTime: null,
      sessionDurationMs: null,
      ...analytics,
    };

    let resp;
    try {
      resp = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role, password }),
      });
    } catch (e) {
      await Cloud.logLogin({ ...baseEntry, success: false, failReason: 'Network error reaching auth service' });
      return { success: false, message: 'Network error — check your internet connection.' };
    }

    let data = {};
    try { data = await resp.json(); } catch {}

    if (!resp.ok || !data.success) {
      await Cloud.logLogin({ ...baseEntry, success: false, failReason: data.message || `HTTP ${resp.status}` });
      return { success: false, message: data.message || 'Authentication failed.' };
    }

    // Sign into Firebase with the custom token returned by our API
    try {
      await fbAuth.signInWithCustomToken(data.customToken);
    } catch (e) {
      await Cloud.logLogin({ ...baseEntry, success: false, failReason: 'Firebase sign-in failed: ' + e.message });
      return { success: false, message: 'Firebase auth failed: ' + e.message };
    }

    // Set local auth state
    State.auth = {
      isAuthenticated: true,
      role: data.role,
      roleKey: data.roleKey,
      sessionId,
      loginTime: Date.now(),
      displayName: data.role,
      uid: data.uid,
    };

    // Log successful login to Firestore
    await Cloud.logLogin({ ...baseEntry, success: true, failReason: null, uid: data.uid });

    return { success: true, role: data.role };
  },

  // Logout: end current Firebase session and stamp the audit log
  async logout() {
    if (State.auth.isAuthenticated && State.auth.sessionId) {
      // Find this session's most recent log entry and stamp logout time
      try {
        const snap = await fbDb.collection('loginLog')
          .where('sessionId', '==', State.auth.sessionId)
          .limit(1)
          .get();
        if (!snap.empty) {
          await snap.docs[0].ref.update({
            logoutTime: Date.now(),
            sessionDurationMs: Date.now() - State.auth.loginTime,
          });
        }
      } catch (e) { console.warn('Logout stamp failed:', e); }
    }

    Cloud.stopSubscriptions();
    try { await fbAuth.signOut(); } catch {}

    State.auth = { isAuthenticated: false, role: null, roleKey: null, sessionId: null, loginTime: null, displayName: null };
  },

  // Password changes are now done by editing Vercel env vars (server-side).
  // This stub remains for backward compatibility with the Settings UI but
  // surfaces a helpful message instead.
  updatePassword(role, newPassword) {
    return false; // handled via deployment env vars
  },
};

/* ========== APP CONTROLLER ========== */
const App = {
  bootDone: false,

  init() {
    hydrate(); // paint local cache instantly

    // Wait for Firebase auth state. If we have a live session, restore it.
    fbAuth.onAuthStateChanged(async (user) => {
      if (user) {
        // Read the role claim from the Firebase ID token
        try {
          const idToken = await user.getIdTokenResult();
          const claims = idToken.claims || {};
          if (claims.roleKey && !State.auth.isAuthenticated) {
            // Restored session from a previous tab/reload (no fresh /api/login call)
            State.auth = {
              isAuthenticated: true,
              role: claims.role || 'Sales Team',
              roleKey: claims.roleKey,
              sessionId: 'restored_' + Date.now(),
              loginTime: claims.issuedAt || Date.now(),
              displayName: claims.role || 'Sales Team',
              uid: user.uid,
            };
          } else if (State.auth.isAuthenticated) {
            // Login flow already populated State.auth
          } else {
            // User signed in but no role claim — sign out and show login
            await fbAuth.signOut();
            this.showLogin();
            return;
          }
        } catch (e) {
          console.error('Auth state error:', e);
          await fbAuth.signOut();
          this.showLogin();
          return;
        }

        // Subscribe to Firestore and seed if empty
        Cloud.startSubscriptions();
        await Cloud.seedIfEmpty();
        this.bootApp();
      } else {
        this.showLogin();
      }
    });
  },

  bootApp() {
    document.getElementById('app').style.display = '';
    document.getElementById('authHost').innerHTML = '';
    this.renderNav();
    this.renderUser();
    this.bindGlobals();
    const startView = localStorage.getItem('sentry-view') || 'dashboard';
    const allowed = this.allowedViews();
    this.go(allowed.includes(startView) ? startView : 'dashboard');
    this.bootDone = true;
  },

  allowedViews() {
    const all = ['dashboard','pipeline','calendar','map','customers','estimates','invoices','crew','materials','analytics','settings','users'];
    if (State.auth.roleKey === 'admin') return all;
    return ['dashboard','pipeline','calendar','map','customers','estimates','invoices','crew','materials','analytics'];
  },

  showLogin() {
    document.getElementById('app').style.display = 'none';
    const host = document.getElementById('authHost');
    host.innerHTML = AuthScreen.render();
    AuthScreen.bind();
  },

  renderUser() {
    const a = State.auth;
    const display = a.displayName || 'User';
    const roleLabel = a.role || 'Guest';
    document.getElementById('userAvatarLetter').textContent = display.charAt(0).toUpperCase();
    document.getElementById('userName').textContent = display;
    document.getElementById('userRole').textContent = roleLabel;
  },

  renderNav() {
    const isAdmin = State.auth.roleKey === 'admin';
    const allItems = [
      { id: 'dashboard', label: 'Dashboard', icon: 'dashboard', adminOnly: false },
      { id: 'pipeline', label: 'Pipeline', icon: 'pipeline', badge: State.jobs.filter(j => !['Completed'].includes(j.status)).length, adminOnly: false },
      { id: 'calendar', label: 'Calendar', icon: 'calendar', adminOnly: false },
      { id: 'map', label: 'Job Map', icon: 'map', adminOnly: false },
      { id: 'customers', label: 'Customers', icon: 'customers', badge: State.customers.length, adminOnly: false },
      { id: 'estimates', label: 'Estimates', icon: 'estimates', adminOnly: false },
      { id: 'invoices', label: 'Invoices', icon: 'invoices', badge: State.invoices.filter(i => i.status !== 'paid').length, adminOnly: false },
      { id: 'crew', label: 'Crew', icon: 'crew', adminOnly: false },
      { id: 'materials', label: 'Materials', icon: 'materials', badge: State.materials.filter(m => m.stock < m.reorder).length || null, adminOnly: false },
      { id: 'analytics', label: 'Analytics', icon: 'analytics', adminOnly: false },
      { id: 'users', label: 'User Management', icon: 'shield', adminOnly: true, badge: State.loginLog.filter(l => l.success && Date.now() - l.timestamp < 86400000).length || null },
      { id: 'settings', label: 'Settings', icon: 'settings', adminOnly: true },
    ];
    const items = allItems.filter(i => !i.adminOnly || isAdmin);

    document.getElementById('nav').innerHTML = items.map(i => `
      <button class="nav-item ${State.view === i.id ? 'active' : ''}" data-view="${i.id}">
        ${ICON[i.icon]}<span>${i.label}</span>
        ${i.badge ? `<span class="badge">${i.badge}</span>` : ''}
      </button>
    `).join('');
    document.querySelectorAll('.nav-item[data-view]').forEach(b => {
      b.addEventListener('click', () => { this.go(b.dataset.view); this.toggleSidebar(false); });
    });
  },

  bindGlobals() {
    document.getElementById('globalSearch').addEventListener('input', (e) => {
      State.filter.search = e.target.value;
      this.render();
    });
  },

  go(view) {
    if (!this.allowedViews().includes(view)) {
      toast('Access denied — Admin role required.', 'error');
      return;
    }
    State.view = view;
    localStorage.setItem('sentry-view', view);
    document.querySelectorAll('.nav-item[data-view]').forEach(b => {
      b.classList.toggle('active', b.dataset.view === view);
    });
    const titles = {
      dashboard: ['Dashboard', 'Overview'],
      pipeline: ['Sales Pipeline', 'Operations'],
      calendar: ['Calendar', 'Scheduling'],
      map: ['Job Map', 'Field View'],
      customers: ['Customers', 'Database'],
      estimates: ['Estimates', 'Quotes'],
      invoices: ['Invoices', 'Billing'],
      crew: ['Crew', 'Team'],
      materials: ['Materials', 'Inventory'],
      analytics: ['Analytics', 'Reports'],
      users: ['User Management', 'Security'],
      settings: ['Settings', 'Configuration'],
    };
    const [title, crumb] = titles[view] || [view, ''];
    document.getElementById('topTitle').textContent = title;
    document.getElementById('crumb').textContent = crumb;
    this.render();
  },

  render() {
    const C = document.getElementById('content');
    // Destroy any existing charts
    Object.values(State.charts).forEach(c => { try { c.destroy(); } catch(e){} });
    State.charts = {};

    switch (State.view) {
      case 'dashboard': C.innerHTML = Views.dashboard(); Views.afterDashboard(); break;
      case 'pipeline': C.innerHTML = Views.pipeline(); Views.afterPipeline(); break;
      case 'calendar': C.innerHTML = Views.calendar(); Views.afterCalendar(); break;
      case 'map': C.innerHTML = Views.map(); Views.afterMap(); break;
      case 'customers': C.innerHTML = Views.customers(); break;
      case 'estimates': C.innerHTML = Views.estimates(); break;
      case 'invoices': C.innerHTML = Views.invoices(); break;
      case 'crew': C.innerHTML = Views.crew(); break;
      case 'materials': C.innerHTML = Views.materials(); break;
      case 'analytics': C.innerHTML = Views.analytics(); Views.afterAnalytics(); break;
      case 'users': C.innerHTML = Views.userManagement(); Views.afterUserManagement(); break;
      case 'settings': C.innerHTML = Views.settings(); break;
    }
  },

  /* MODALS */
  openModal(type, payload) {
    const host = document.getElementById('modal-host');
    if (type === 'newJob') host.innerHTML = Modals.newJob(payload);
    else if (type === 'jobDetail') host.innerHTML = Modals.jobDetail(payload);
    else if (type === 'estimateBuilder') host.innerHTML = Modals.estimateBuilder(payload);
    else if (type === 'invoice') host.innerHTML = Modals.invoice(payload);
    else if (type === 'newCrew') host.innerHTML = Modals.newCrew();
    else if (type === 'newMaterial') host.innerHTML = Modals.newMaterial();
    else if (type === 'newCustomer') host.innerHTML = Modals.newCustomer();
    Modals.afterOpen(type, payload);
  },
  closeModal() {
    document.getElementById('modal-host').innerHTML = '';
  },

  toggleSidebar(force) {
    const sb = document.querySelector('.sidebar');
    const bd = document.getElementById('sidebarBackdrop');
    if (!sb || !bd) return;
    const willOpen = force === true ? true : (force === false ? false : !sb.classList.contains('open'));
    sb.classList.toggle('open', willOpen);
    bd.classList.toggle('show', willOpen);
    document.body.style.overflow = willOpen ? 'hidden' : '';
  },

  toggleQuickAdd() {
    const choices = [
      ['New Lead', () => this.openModal('newJob')],
      ['Build Estimate', () => this.openModal('estimateBuilder')],
      ['Add Customer', () => this.openModal('newCustomer')],
      ['Add Crew Member', () => this.openModal('newCrew')],
      ['Add Material', () => this.openModal('newMaterial')],
    ];
    const html = `
      <div class="modal-backdrop" onclick="App.closeModal()">
        <div class="modal modal-sm" onclick="event.stopPropagation()">
          <div class="modal-head">
            <div><h2>Quick Add</h2><div class="sub">What do you want to create?</div></div>
            <button class="modal-close" onclick="App.closeModal()">${ICON.x}</button>
          </div>
          <div class="modal-body" style="display:flex;flex-direction:column;gap:8px;">
            ${choices.map((c, i) => `<button class="btn btn-ghost" style="justify-content:flex-start;padding:14px;" data-q="${i}">${c[0]}</button>`).join('')}
          </div>
        </div>
      </div>`;
    document.getElementById('modal-host').innerHTML = html;
    document.querySelectorAll('[data-q]').forEach(b => {
      b.addEventListener('click', () => { App.closeModal(); choices[+b.dataset.q][1](); });
    });
  },

  /* ACTIONS */
  saveJob(jobData) {
    const existing = State.jobs.find(j => j.id === jobData.id);
    if (existing) {
      Object.assign(existing, jobData, { updatedAt: Date.now() });
      logActivity('job_updated', `Updated ${jobData.customerName}`);
    } else {
      const newJob = {
        id: uid('j'), photos: [], notes: [], tasks: [
          { id: 't1', text: 'Site visit & measurement', done: false },
          { id: 't2', text: 'Submit quote to customer', done: false },
          { id: 't3', text: 'Sign contract & collect deposit', done: false },
          { id: 't4', text: 'Order materials', done: false },
          { id: 't5', text: 'Dig Safe call (72hr advance)', done: false },
          { id: 't6', text: 'Install & cleanup', done: false },
          { id: 't7', text: 'Final walkthrough & invoice', done: false },
        ],
        history: [{ from: jobData.status || 'Lead', to: jobData.status || 'Lead', userRole: State.settings.user.role, timestamp: new Date().toISOString() }],
        createdAt: Date.now(), updatedAt: Date.now(),
        ...jobData,
      };
      State.jobs.unshift(newJob);
      logActivity('job_created', `New lead: ${newJob.customerName}`);

      if (!State.customers.find(c => c.name === newJob.customerName)) {
        State.customers.unshift({
          id: uid('cust'), name: newJob.customerName, phone: newJob.phone, email: newJob.email,
          address: newJob.address, town: newJob.town,
          firstSeen: Date.now(), totalValue: newJob.totalValue || 0, jobs: 1, status: 'active', rating: 5,
        });
      }
    }
    persist();
    this.renderNav();
    this.render();
    toast('Saved.');
  },

  deleteJob(id) {
    if (!confirm('Permanently delete this lead?')) return;
    const j = State.jobs.find(j => j.id === id);
    State.jobs = State.jobs.filter(j => j.id !== id);
    logActivity('job_deleted', `Deleted ${j?.customerName || 'job'}`);
    persist();
    this.closeModal();
    this.render();
    this.renderNav();
    toast('Deleted.', 'info');
  },

  updateStatus(id, newStatus) {
    const job = State.jobs.find(j => j.id === id);
    if (!job || job.status === newStatus) return;
    const oldStatus = job.status;
    job.history.push({ from: oldStatus, to: newStatus, userRole: State.settings.user.role, timestamp: new Date().toISOString() });
    job.status = newStatus;
    job.updatedAt = Date.now();
    logActivity('job_promoted', `${job.customerName}: ${oldStatus} → ${newStatus}`);
    persist();
    this.render();
    this.renderNav();
    toast(`Moved to ${newStatus}`);
  },

  toggleTask(jobId, taskId) {
    const job = State.jobs.find(j => j.id === jobId);
    const task = job?.tasks.find(t => t.id === taskId);
    if (!task) return;
    task.done = !task.done;
    job.updatedAt = Date.now();
    persist();
    if (document.querySelector('.modal')) this.openModal('jobDetail', job);
    else this.render();
  },

  addNote(jobId) {
    const text = document.getElementById('newNote')?.value?.trim();
    if (!text) return;
    const job = State.jobs.find(j => j.id === jobId);
    if (!job) return;
    job.notes = job.notes || [];
    job.notes.unshift({ ts: Date.now(), author: State.settings.user.name, text });
    job.updatedAt = Date.now();
    logActivity('note_added', `Note on ${job.customerName}`);
    persist();
    this.openModal('jobDetail', job);
  },

  scheduleJob(jobId) {
    const date = document.getElementById('schedDate')?.value;
    const crewId = document.getElementById('schedCrew')?.value;
    const job = State.jobs.find(j => j.id === jobId);
    if (!job) return;
    job.scheduledDate = date;
    job.crewId = crewId;
    if (date && job.status === 'Contract') {
      job.history.push({ from: 'Contract', to: 'Scheduled', userRole: State.settings.user.role, timestamp: new Date().toISOString() });
      job.status = 'Scheduled';
    }
    job.updatedAt = Date.now();
    logActivity('job_scheduled', `${job.customerName} scheduled for ${date}`);
    persist();
    this.openModal('jobDetail', job);
    this.renderNav();
    toast('Scheduled.');
  },

  saveCrew(data) {
    const ex = State.crew.find(c => c.id === data.id);
    if (ex) Object.assign(ex, data);
    else State.crew.push({ id: uid('c'), color: '#1a365d', hours: 0, ...data });
    persist();
    this.render();
    toast('Crew saved.');
  },

  saveMaterial(data) {
    const ex = State.materials.find(m => m.id === data.id);
    if (ex) Object.assign(ex, data);
    else State.materials.push({ id: uid('m'), ...data });
    persist();
    this.renderNav();
    this.render();
    toast('Material saved.');
  },

  saveCustomer(data) {
    const ex = State.customers.find(c => c.id === data.id);
    if (ex) Object.assign(ex, data);
    else State.customers.unshift({ id: uid('cust'), firstSeen: Date.now(), totalValue: 0, jobs: 0, status: 'active', rating: 5, ...data });
    persist();
    this.renderNav();
    this.render();
    toast('Customer saved.');
  },

  generateInvoice(jobId) {
    const job = State.jobs.find(j => j.id === jobId);
    if (!job) return;
    const exists = State.invoices.find(i => i.jobId === jobId);
    if (exists) { App.openModal('invoice', exists); return; }
    const num = 'INV-' + (1000 + State.invoices.length + 1);
    const inv = {
      id: uid('inv'), number: num, jobId, customer: job.customerName,
      amount: job.totalValue, deposit: Math.round(job.totalValue * State.settings.company.depositPct / 100),
      balance: Math.round(job.totalValue * (1 - State.settings.company.depositPct / 100)),
      status: 'sent', issued: Date.now(), due: Date.now() + 30 * 86400000,
    };
    State.invoices.unshift(inv);
    logActivity('invoice_sent', `Invoice ${num} created for ${job.customerName}`);
    persist();
    this.renderNav();
    App.openModal('invoice', inv);
  },

  exportCSV(type) {
    let rows = [], filename = '';
    if (type === 'jobs') {
      rows = [['Customer', 'Status', 'Service', 'Value', 'Town', 'Address', 'Phone', 'Email', 'Created']];
      State.jobs.forEach(j => rows.push([j.customerName, j.status, j.serviceType, j.totalValue, j.town, j.address, j.phone, j.email, fmt.date(j.createdAt)]));
      filename = 'sentry-jobs.csv';
    } else if (type === 'customers') {
      rows = [['Name', 'Phone', 'Email', 'Address', 'Town', 'Total Value', 'Jobs', 'Rating']];
      State.customers.forEach(c => rows.push([c.name, c.phone, c.email, c.address, c.town, c.totalValue, c.jobs, c.rating]));
      filename = 'sentry-customers.csv';
    } else if (type === 'invoices') {
      rows = [['Number', 'Customer', 'Amount', 'Deposit', 'Balance', 'Status', 'Issued', 'Due']];
      State.invoices.forEach(i => rows.push([i.number, i.customer, i.amount, i.deposit, i.balance, i.status, fmt.date(i.issued), fmt.date(i.due)]));
      filename = 'sentry-invoices.csv';
    }
    const csv = rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
    toast('Exported.');
  },

  resetData() {
    if (!confirm('This will erase ALL data and restore demo seed data. Continue?')) return;
    localStorage.removeItem(STORAGE_KEY);
    sessionStorage.removeItem(STORAGE_KEY + ':auth');
    location.reload();
  },

  updateRolePassword(role) {
    if (State.auth.roleKey !== 'admin') { toast('Admin only.', 'error'); return; }
    const id = role === 'sales' ? 'pwSales' : 'pwAdmin';
    const newPw = document.getElementById(id).value.trim();
    if (newPw.length < 4) { toast('Password must be at least 4 characters.', 'error'); return; }
    Auth.updatePassword(role, newPw);
    toast(`${role === 'sales' ? 'Sales Team' : 'Admin'} password updated.`);
  },

  exportLoginLog() {
    const rows = [['When', 'Role', 'Result', 'Public IP', 'Local IP', 'Device', 'Browser', 'Browser Version', 'OS', 'OS Version', 'Screen', 'Window', 'Timezone', 'Language', 'CPU Cores', 'Memory', 'Connection', 'Session ID', 'Session Duration (min)', 'User Agent']];
    State.loginLog.forEach(l => rows.push([
      new Date(l.timestamp).toLocaleString(),
      l.role,
      l.success ? 'Success' : 'Failed',
      l.publicIP || '',
      l.localIP || '',
      l.device || '',
      l.browser || '',
      l.browserVersion || '',
      l.os || '',
      l.osVersion || '',
      l.screenResolution || '',
      l.windowSize || '',
      l.timezone || '',
      l.language || '',
      l.cpuCores || '',
      l.deviceMemory || '',
      l.connectionType || '',
      l.sessionId || '',
      l.sessionDurationMs ? Math.round(l.sessionDurationMs / 60000) : '',
      l.userAgent || '',
    ]));
    const csv = rows.map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'sentry-login-audit.csv'; a.click();
    toast('Login log exported.');
  },

  async logout() {
    if (!confirm('Sign out now?')) return;
    await Auth.logout();
    State.view = 'dashboard';
    this.bootDone = false;
    toast('Signed out securely.');
    setTimeout(() => this.showLogin(), 200);
  },
};

/* ========== AUTH SCREEN ========== */
const AuthScreen = {
  selectedRole: 'sales',
  showPw: false,

  render() {
    const r = this.selectedRole;
    return `
      <div class="auth-screen">
        <div class="auth-shell">
          <div class="auth-brand">
            <div class="auth-brand-mark">SF</div>
            <div>
              <div class="auth-brand-name">Sentry Fence</div>
              <div class="auth-brand-sub">CRM Pro · Secure Access</div>
            </div>
          </div>

          <div class="auth-card">
            <h2>Welcome Back</h2>
            <p class="auth-sub">Select your role and enter the password to continue</p>

            <div class="role-grid">
              <button class="role-btn ${r==='sales'?'active':''}" data-role="sales" type="button">
                <div class="role-icon">${ICON.crew}</div>
                <div class="role-label">Sales Team</div>
                <div class="role-desc">Field & Quotes</div>
              </button>
              <button class="role-btn ${r==='admin'?'active':''}" data-role="admin" type="button">
                <div class="role-icon">${ICON.shield}</div>
                <div class="role-label">Admin</div>
                <div class="role-desc">Full Access</div>
              </button>
            </div>

            <form id="authForm" autocomplete="off">
              <div class="password-field">
                <input id="authPw" type="${this.showPw?'text':'password'}" placeholder="Password" autocomplete="new-password" autofocus />
                <button type="button" class="password-toggle" id="authToggle">${this.showPw ? ICON.eyeOff : ICON.eye}</button>
              </div>

              <div id="authErr"></div>

              <button class="auth-submit" id="authSubmit" type="submit">
                ${ICON.lock}
                <span>Sign In Securely</span>
              </button>
            </form>
          </div>

          <div class="auth-foot">
            <strong>${ICON.shield}</strong> All sign-ins are recorded with device analytics<br>
            Sentry Fence Company · Peabody, MA · Lic #402919
          </div>
        </div>
      </div>
    `;
  },

  bind() {
    document.querySelectorAll('.role-btn[data-role]').forEach(btn => {
      btn.addEventListener('click', () => {
        this.selectedRole = btn.dataset.role;
        document.querySelectorAll('.role-btn').forEach(b => b.classList.toggle('active', b === btn));
        document.getElementById('authPw').focus();
      });
    });

    document.getElementById('authToggle').addEventListener('click', () => {
      this.showPw = !this.showPw;
      const inp = document.getElementById('authPw');
      const tog = document.getElementById('authToggle');
      inp.type = this.showPw ? 'text' : 'password';
      tog.innerHTML = this.showPw ? ICON.eyeOff : ICON.eye;
    });

    document.getElementById('authForm').addEventListener('submit', (e) => {
      e.preventDefault();
      this.submit();
    });
  },

  async submit() {
    const pw = document.getElementById('authPw').value;
    if (!pw) {
      document.getElementById('authErr').innerHTML = `<div class="auth-error">${ICON.alert}<span>Please enter your password.</span></div>`;
      return;
    }
    const submit = document.getElementById('authSubmit');
    submit.disabled = true;
    submit.innerHTML = `${ICON.refresh}<span>Verifying & capturing analytics…</span>`;
    document.getElementById('authErr').innerHTML = '';

    const result = await Auth.attemptLogin(this.selectedRole, pw);

    if (result.success) {
      submit.innerHTML = `${ICON.check}<span>Authenticated — loading…</span>`;
      setTimeout(() => App.bootApp(), 250);
    } else {
      document.getElementById('authErr').innerHTML = `<div class="auth-error">${ICON.alert}<span>${escHtml(result.message)}</span></div>`;
      submit.disabled = false;
      submit.innerHTML = `${ICON.lock}<span>Sign In Securely</span>`;
      document.getElementById('authPw').focus();
      document.getElementById('authPw').select();
    }
  },
};

    const activeInstalls = j.filter(x => x.status === 'Installation' || x.status === 'Scheduled').length;

    const overdueInv = State.invoices.filter(i => i.status === 'overdue').length;

      .sort((a, b) => new Date(a.scheduledDate) - new Date(b.scheduledDate)).slice(0, 6);

    const followUps = j.filter(x => x.status === 'Quote Sent' && (Date.now() - x.updatedAt) > 5 * 86400000).slice(0, 5);

    return `
      <div class="page-head">
        <div>
          <h1>Welcome back, ${escHtml((State.auth.displayName || State.settings.user.name).split(' ')[0])}</h1>
          <p>Here's what's happening across Sentry Fence today — ${new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}.</p>
        </div>
