  afterDashboard() {
    // Revenue 12-week trend (synthetic from completed jobs by week + projection)
    const weeks = [];
    for (let i = 11; i >= 0; i--) {
      const start = Date.now() - i * 7 * 86400000;
      const end = start + 7 * 86400000;
      const revenue = State.jobs.filter(j => j.status === 'Completed' && j.updatedAt >= start && j.updatedAt < end).reduce((a, x) => a + x.totalValue, 0);
      const target = 12000 + Math.sin(i / 2) * 4000 + 8000;
      weeks.push({ label: 'W' + (12 - i), revenue: revenue || Math.round(target + Math.random() * 4000), target });
    }
    State.charts.revenue = new Chart(document.getElementById('ds-revenue'), {
      type: 'line',
      data: {
        labels: weeks.map(w => w.label),
        datasets: [
          { label: 'Closed Revenue', data: weeks.map(w => w.revenue), borderColor: '#1a365d', backgroundColor: 'rgba(26,54,93,.08)', fill: true, tension: .35, pointRadius: 3 },
          { label: 'Target', data: weeks.map(w => Math.round(w.target)), borderColor: '#c5a059', borderDash: [5, 4], pointRadius: 0, tension: .35, fill: false },
        ]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } }, scales: { y: { ticks: { callback: v => '$' + (v / 1000) + 'k' } } } }
    });

    const stageData = STAGES.map(s => State.jobs.filter(j => j.status === s).length);
    State.charts.stage = new Chart(document.getElementById('ds-stage'), {
      type: 'doughnut',
      data: {
        labels: STAGES,
        datasets: [{ data: stageData, backgroundColor: ['#94a3b8', '#2563eb', '#7c3aed', '#c5a059', '#d97706', '#059669'], borderWidth: 0 }]
      },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, boxWidth: 12 } } }, cutout: '65%' }
    });
  },

  filterBar() {
    const towns = Array.from(new Set(State.jobs.map(j => j.town).filter(Boolean)));
    return `
      <div class="chips">
        <button class="chip ${State.filter.priority === 'all' ? 'active' : ''}" onclick="State.filter.priority='all';App.render();">${ICON.filter} All Priority</button>
        ${['Urgent', 'High', 'Medium', 'Low'].map(p => `

  filteredJobs() {
    const f = State.filter;
    const term = (f.search || '').toLowerCase();
    return State.jobs.filter(j => {
      if (f.priority !== 'all' && j.priority !== f.priority) return false;
      if (f.town !== 'all' && j.town !== f.town) return false;
      if (term) {
        const hay = (j.customerName + ' ' + j.address + ' ' + j.town + ' ' + j.serviceType + ' ' + (j.description || '')).toLowerCase();
        if (!hay.includes(term)) return false;
      }
      return true;
    });
  },

    const jobs = this.filteredJobs().filter(j => j.status === stage);

    return `

        <div class="col-head">
          <div class="col-title"><span class="col-dot"></span>${stage}<span class="col-count">${jobs.length}</span></div>

          ${jobs.length ? jobs.map(j => this.jobCard(j)).join('') : `<div class="empty-col">No projects here</div>`}
        </div>
      </div>

  },

  handleDragStart(e, jobId) {
    e.dataTransfer.setData('jobId', jobId);

  /* CALENDAR */
  calendar() {
    const M = State.calendarMonth, Y = State.calendarYear;
    const monthName = new Date(Y, M, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    const first = new Date(Y, M, 1);
    const last = new Date(Y, M + 1, 0);
    const startDow = first.getDay();
    const days = [];
    for (let i = 0; i < startDow; i++) {
      const d = new Date(Y, M, 0 - (startDow - i - 1));
      days.push({ d, outside: true });
    }
    for (let i = 1; i <= last.getDate(); i++) days.push({ d: new Date(Y, M, i) });
    while (days.length < 42) {
      const d = new Date(Y, M + 1, days.length - last.getDate() - startDow + 1);
      days.push({ d, outside: true });
    }
    const today = new Date();

    return `
      <div class="page-head">
        <div><h1>Calendar</h1><p>Schedule installs, view crew availability, plan the week.</p></div>
        <div class="page-actions">
          <button class="btn btn-ghost btn-sm" onclick="State.calendarMonth--;if(State.calendarMonth<0){State.calendarMonth=11;State.calendarYear--;}App.render();">←</button>
          <button class="btn btn-ghost btn-sm" onclick="State.calendarMonth=new Date().getMonth();State.calendarYear=new Date().getFullYear();App.render();">Today</button>
          <button class="btn btn-ghost btn-sm" onclick="State.calendarMonth++;if(State.calendarMonth>11){State.calendarMonth=0;State.calendarYear++;}App.render();">→</button>
        </div>
      </div>

      <div class="calendar">
        <div class="cal-head">
          <div class="cal-month">${monthName}</div>
          <div style="display:flex;gap:14px;align-items:center;font-size:11px;color:var(--ink-muted);">
            <span style="display:flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;background:var(--gold);border-radius:3px;"></span> Install</span>
            <span style="display:flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;background:var(--green);border-radius:3px;"></span> Site Visit</span>
            <span style="display:flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;background:var(--blue);border-radius:3px;"></span> Follow-up</span>
          </div>
        </div>
        <div class="cal-grid">
          ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="cal-dow">${d}</div>`).join('')}
          ${days.map(({ d, outside }) => {
            const iso = d.toISOString().slice(0, 10);
            const events = State.jobs.filter(j => j.scheduledDate === iso);
            const isToday = d.toDateString() === today.toDateString();
            return `
              <div class="cal-day ${outside ? 'outside' : ''} ${isToday ? 'today' : ''}">
                <div class="cal-num">${d.getDate()}</div>
                ${events.map(j => `
                  <span class="cal-event installation" onclick='Views.openJobDetail("${j.id}")' title="${escHtml(j.customerName)} - ${escHtml(j.serviceType)}">${escHtml(j.customerName)}</span>
                `).join('')}
              </div>
            `;
          }).join('')}
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;">
        <div class="card">
          <div class="card-head"><h3>This Week's Schedule</h3><div class="sub">Crew workload</div></div>
          <div style="padding:14px;">
            ${State.crew.map(c => {
              const weekJobs = State.jobs.filter(j => j.crewId === c.id && j.scheduledDate &&

                    <div style="width:${load}%;height:100%;background:${load>80?'var(--red)':load>50?'var(--gold)':'var(--green)'};"></div>
                  </div>
                </div>`;
            }).join('')}
          </div>
        </div>

        <div class="card">
          <div class="card-head"><h3>Today's Conditions</h3><div class="sub">Weather check</div></div>
          <div style="padding:18px;display:flex;align-items:center;gap:18px;">
            <div style="font-size:48px;color:var(--gold);">${ICON.sun}</div>

              <div style="font-size:32px;font-weight:800;color:var(--navy);line-height:1;">68°F</div>

            </div>

      </div>
    `;

  map() {
    const townCounts = {};
    State.jobs.forEach(j => { townCounts[j.town] = (townCounts[j.town] || 0) + 1; });
    const statusCounts = {
      Lead: State.jobs.filter(j => j.status === 'Lead').length,
      Active: State.jobs.filter(j => ['Quote Sent','Contract','Scheduled'].includes(j.status)).length,
      Installation: State.jobs.filter(j => j.status === 'Installation').length,
      Completed: State.jobs.filter(j => j.status === 'Completed').length,
    };

    return `
      <div class="page-head">
        <div><h1>Job Map</h1><p>All active and recent jobs plotted across the North Shore service area.</p></div>
        <div class="page-actions">
          <span style="font-size:11px;color:var(--ink-muted);font-weight:700;letter-spacing:.1em;text-transform:uppercase;">${State.jobs.length} pins · ${Object.keys(townCounts).length} towns</span>
        </div>
      </div>

      <div class="map-canvas" id="mapCanvas">
        ${this.mapSVG()}
        <div class="map-overlay">
          <div class="map-title-card">
            <span class="dot"></span>North Shore · Service Region
          </div>
          ${State.jobs.map(j => {
            const base = this.townPos[j.town] || { x: 50, y: 50 };
            // Deterministic offset per job so pins don't jitter on re-render
            const seed = j.id ? j.id.split('').reduce((a, c) => a + c.charCodeAt(0), 0) : 0;
            const dx = ((seed * 13) % 80) / 10 - 4;   // -4 .. +4
            const dy = ((seed * 7) % 80) / 10 - 4;
            const x = Math.max(2, Math.min(98, base.x + dx));
            const y = Math.max(4, Math.min(96, base.y + dy));
            const cls = j.status === 'Lead' ? 'lead'
                      : j.status === 'Completed' ? 'completed'
                      : j.status === 'Installation' ? 'installation'
                      : j.status === 'Scheduled' ? 'scheduled'
                      : '';
            return `
              <div class="map-pin ${cls}" style="left:${x}%;top:${y}%;" onclick='Views.openJobDetail("${j.id}")' title="${escHtml(j.customerName)} · ${escHtml(j.status)}">
                <div class="map-pin-dot"><span>${escHtml(j.customerName.charAt(0))}</span></div>
              </div>
            `;
          }).join('')}
          <div class="map-legend">
            <div class="row"><span class="swatch" style="background:#2563eb;"></span> Lead (${statusCounts.Lead})</div>
            <div class="row"><span class="swatch" style="background:#c5a059;"></span> Active Quote/Contract (${statusCounts.Active})</div>
            <div class="row"><span class="swatch" style="background:#dc2626;"></span> Installation (${statusCounts.Installation})</div>
            <div class="row"><span class="swatch" style="background:#059669;"></span> Completed (${statusCounts.Completed})</div>
          </div>
        </div>
      </div>

      <div class="card" style="margin-top:18px;">
        <div class="card-head"><h3>Jobs by Town</h3><div class="sub">Geographic distribution &amp; revenue</div></div>
        <div style="padding:14px;">
          ${Object.entries(townCounts).sort((a, b) => b[1] - a[1]).map(([town, count]) => {
            const value = State.jobs.filter(j => j.town === town).reduce((a, x) => a + x.totalValue, 0);
            const max = Math.max(...Object.values(townCounts));
            const pct = (count / max) * 100;
            return `
              <div style="display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line-soft);">
                <div style="font-size:13px;font-weight:600;width:130px;flex-shrink:0;">${escHtml(town)}</div>
                <div style="flex:1;height:8px;background:var(--line-soft);border-radius:999px;overflow:hidden;">
                  <div style="width:${pct}%;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft));border-radius:999px;"></div>
                </div>
                <div style="font-size:11px;color:var(--ink-muted);font-weight:700;width:60px;text-align:right;">${count} job${count>1?'s':''}</div>
                <div style="font-size:13px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;width:110px;text-align:right;">${fmt.money(value)}</div>
              </div>`;
          }).join('')}
        </div>
      </div>
    `;
  },

const Modals = {
  newJob(prefill) {
    const p = prefill || {};
    return `
      <div class="modal-backdrop" onclick="App.closeModal()">
        <div class="modal modal-md" onclick="event.stopPropagation()">

              </div>

                <select id="njPriority">
                  <option>Low</option><option selected>Medium</option><option>High</option><option>Urgent</option>
                </select>
              </div>
              <div class="field"><label>Linear Feet</label><input id="njLF" type="number" value="0"/></div>
              <div class="field"><label>Estimated Value</label><input id="njValue" type="number" value="0"/></div>

  submitJob() {
    const data = {
      customerName: document.getElementById('njName').value.trim(),
      phone: document.getElementById('njPhone').value.trim(),
      email: document.getElementById('njEmail').value.trim(),
      address: document.getElementById('njAddress').value.trim(),
      town: document.getElementById('njTown').value.trim(),
      serviceType: document.getElementById('njService').value,
      priority: document.getElementById('njPriority').value,
      linearFeet: Number(document.getElementById('njLF').value) || 0,
      estimatedValue: Number(document.getElementById('njValue').value) || 0,
      totalValue: Number(document.getElementById('njValue').value) || 0,
      description: document.getElementById('njDesc').value,
      status: 'Lead',
      materialCost: Math.round((Number(document.getElementById('njValue').value) || 0) * 0.42),
      laborCost: Math.round((Number(document.getElementById('njValue').value) || 0) * 0.28),
      gateCount: 0,
    };
    if (!data.customerName) { toast('Customer name required', 'error'); return; }
    App.saveJob(data);
    App.closeModal();
  },

  jobDetail(job) {
    const j = State.jobs.find(x => x.id === job.id) || job;
    const crew = State.crew.find(c => c.id === j.crewId);
    const profit = j.totalValue - (j.materialCost || 0) - (j.laborCost || 0);
    const margin = j.totalValue ? (profit / j.totalValue * 100).toFixed(1) : 0;

              <div class="field"><label>Service Type</label>
                <select id="ebService" onchange="Modals.recalc()">${SERVICES.map(s => `<option ${j.serviceType===s?'selected':''}>${s}</option>`).join('')}</select>

            <div style="margin-top:18px;background:var(--cream);padding:18px;border-radius:var(--radius);border:1px solid var(--line);">

                <div><div class="micro-label">Subtotal</div><div id="ebSub" style="font-size:18px;font-weight:800;color:var(--navy);">$0</div></div>
                <div><div class="micro-label">Material Cost</div><div id="ebMat" style="font-size:18px;font-weight:800;">$0</div></div>
                <div><div class="micro-label">Labor Cost</div><div id="ebLab" style="font-size:18px;font-weight:800;">$0</div></div>
                <div><div class="micro-label">Net Profit</div><div id="ebProf" style="font-size:18px;font-weight:800;color:var(--green);">$0</div></div>
              </div>
              <div style="margin-top:14px;height:8px;background:var(--line);border-radius:999px;overflow:hidden;display:flex;">
                <div id="ebMatBar" style="background:var(--gold);height:100%;"></div>
                <div id="ebLabBar" style="background:var(--navy);height:100%;"></div>
                <div id="ebProBar" style="background:var(--green);height:100%;"></div>
              </div>
              <div style="display:flex;justify-content:space-between;margin-top:5px;font-size:10px;color:var(--ink-muted);font-weight:700;">
                <span>Material</span><span>Labor</span><span>Profit</span>
              </div>
            </div>
          </div>
          <div class="modal-foot">
            <button class="btn btn-ghost" onclick="App.closeModal()">Cancel</button>
            ${j.id ? `<button class="btn btn-primary" onclick="Modals.saveEstimate('${j.id}')">${ICON.check} Update Job</button>` : `<button class="btn btn-primary" onclick="Modals.saveEstimateAsLead()">${ICON.check} Save as New Lead</button>`}
          </div>
        </div>
      </div>
    `;
  },

  recalc() {
    const lf = +document.getElementById('ebLF').value || 0;
    const cpf = +document.getElementById('ebCPF').value || 0;
    const gates = +document.getElementById('ebGates').value || 0;
    const gc = +document.getElementById('ebGateCost').value || 0;
    const mp = +document.getElementById('ebMatPct').value || 0;
    const lp = +document.getElementById('ebLabPct').value || 0;
    const sub = lf * cpf + gates * gc;
    const mat = Math.round(sub * mp / 100);
    const lab = Math.round(sub * lp / 100);
    const prof = sub - mat - lab;
    document.getElementById('ebSub').textContent = fmt.money(sub);
    document.getElementById('ebMat').textContent = fmt.money(mat);
    document.getElementById('ebLab').textContent = fmt.money(lab);
    document.getElementById('ebProf').textContent = fmt.money(prof);
    const total = Math.max(1, sub);
    document.getElementById('ebMatBar').style.width = (mat / total * 100) + '%';
    document.getElementById('ebLabBar').style.width = (lab / total * 100) + '%';
    document.getElementById('ebProBar').style.width = (Math.max(0, prof) / total * 100) + '%';
  },

  saveEstimate(jobId) {
    const job = State.jobs.find(j => j.id === jobId);
    if (!job) return;
    const lf = +document.getElementById('ebLF').value;
    const cpf = +document.getElementById('ebCPF').value;
    const gates = +document.getElementById('ebGates').value;
    const gc = +document.getElementById('ebGateCost').value;
    const sub = lf * cpf + gates * gc;
    const mp = +document.getElementById('ebMatPct').value;
    const lp = +document.getElementById('ebLabPct').value;
    job.linearFeet = lf;
    job.costPerFoot = cpf;
    job.gateCount = gates;
    job.totalValue = sub;
    job.estimatedValue = sub;
    job.materialCost = Math.round(sub * mp / 100);
    job.laborCost = Math.round(sub * lp / 100);
    job.serviceType = document.getElementById('ebService').value;
    job.updatedAt = Date.now();
    persist();
    App.closeModal();
    App.render();
    toast('Estimate updated.');
  },

  saveEstimateAsLead() {
    const lf = +document.getElementById('ebLF').value;
    const cpf = +document.getElementById('ebCPF').value;
    const gates = +document.getElementById('ebGates').value;
    const gc = +document.getElementById('ebGateCost').value;
    const sub = lf * cpf + gates * gc;
    const mp = +document.getElementById('ebMatPct').value;
    const lp = +document.getElementById('ebLabPct').value;
    App.saveJob({
      customerName: document.getElementById('ebName').value || 'New Estimate',
      address: '', town: '', phone: '', email: '',
      serviceType: document.getElementById('ebService').value,
      priority: 'Medium', status: 'Quote Sent',
      linearFeet: lf, costPerFoot: cpf, gateCount: gates,
      totalValue: sub, estimatedValue: sub,
      materialCost: Math.round(sub * mp / 100),
      laborCost: Math.round(sub * lp / 100),
    });
    App.closeModal();
  },

/* ========== ESTIMATE SCANNER ========== */
const EstimateScanner = {
  // Trigger native file picker (camera roll on iOS)
  start() {
    const input = document.getElementById('estimateFileInput');
    if (input) { input.value = ''; input.click(); }
  },

  // Compress image client-side: max 1400px long edge, 70% JPEG quality
  compress(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Could not read file'));
      reader.onload = (e) => {
        const img = new Image();
        img.onerror = () => reject(new Error('Could not decode image'));
        img.onload = () => {
          const MAX = 1400;
          let w = img.width, h = img.height;
          if (w > h && w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
          else if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          // White background in case the image has transparency
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', 0.7));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  },

  async handleFile(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;

    this.showProgress('Compressing image…');

    let dataUrl;
    try {
      dataUrl = await this.compress(file);
    } catch (e) {
      this.hideProgress();
      toast('Image compress failed: ' + e.message, 'error');
      return;
    }

    this.showProgress('Reading handwriting with AI… (≈3s)');

    let result;
    try {
      const resp = await fetch('/api/scan-estimate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageBase64: dataUrl }),
      });
      result = await resp.json();
      if (!resp.ok || !result.success) {
        throw new Error(result.message || ('HTTP ' + resp.status));
      }
    } catch (e) {
      this.hideProgress();
      toast('AI scan failed: ' + e.message, 'error');
      return;
    }

    this.hideProgress();
    this.openConfirm(result.data, dataUrl);
  },

  showProgress(message) {
    const host = document.getElementById('modal-host');
    host.innerHTML = `
      <div class="modal-backdrop" style="z-index:120;">
        <div class="modal modal-sm" onclick="event.stopPropagation()" style="max-width:380px;">
          <div class="modal-body" style="padding:32px;text-align:center;">
            <div style="width:48px;height:48px;margin:0 auto 18px;border:3px solid var(--cream-2);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;"></div>
            <div style="font-size:14px;font-weight:600;color:var(--navy);">${escHtml(message)}</div>
            <div style="font-size:11px;color:var(--ink-faint);margin-top:6px;letter-spacing:.05em;">Sentry Fence AI Scanner</div>
          </div>
        </div>
      </div>
      <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    `;
  },

  hideProgress() {
    document.getElementById('modal-host').innerHTML = '';
  },

  // Show parsed fields with image preview, let user edit before saving
  openConfirm(data, imageDataUrl) {
    // Stash so saveScanned can pull from it
    this._pending = { data, imageDataUrl };

    const host = document.getElementById('modal-host');
    host.innerHTML = `
      <div class="modal-backdrop" onclick="App.closeModal()">
        <div class="modal modal-lg" onclick="event.stopPropagation()">
          <div class="modal-head">
            <div>
              <h2>Review Scanned Estimate</h2>
              <div class="sub">AI extracted these fields — edit anything that's off, then save</div>
            </div>
            <button class="modal-close" onclick="App.closeModal()">${ICON.x}</button>
          </div>
          <div class="modal-body">
            <div style="display:grid;grid-template-columns:1fr 1.2fr;gap:18px;align-items:start;">
              <div>
                <div style="font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin-bottom:8px;">Original Estimate</div>
                <div style="background:var(--cream);border:1px solid var(--line);border-radius:var(--radius);padding:6px;">
                  <img src="${imageDataUrl}" style="width:100%;height:auto;border-radius:6px;display:block;" />
                </div>
                <div style="font-size:11px;color:var(--ink-muted);margin-top:8px;line-height:1.5;">
                  This image will be attached to the card so the install crew can reference the original handwritten notes and diagram.
                </div>
              </div>
              <div>
                <div class="form-grid">
                  <div class="field"><label>Customer Name</label><input id="scnName" value="${escHtml(data.customerName||'')}"/></div>
                  <div class="field"><label>Phone</label><input id="scnPhone" value="${escHtml(data.phone||'')}" oninput="this.value=fmt.phone(this.value)" maxlength="14"/></div>
                  <div class="field full"><label>Email</label><input id="scnEmail" value="${escHtml(data.email||'')}" type="email"/></div>
                  <div class="field"><label>Address</label><input id="scnAddress" value="${escHtml(data.address||'')}"/></div>
                  <div class="field"><label>Town</label><input id="scnTown" value="${escHtml(data.town||'')}"/></div>
                  <div class="field"><label>Service Type</label>
                    <select id="scnService">
                      ${SERVICES.map(s => `<option ${data.serviceType===s?'selected':''}>${s}</option>`).join('')}
                      ${!SERVICES.includes(data.serviceType) && data.serviceType ? `<option selected>${escHtml(data.serviceType)}</option>` : ''}
                    </select>
                  </div>
                  <div class="field"><label>Total Value ($)</label><input id="scnTotal" type="number" value="${data.totalValue||0}"/></div>
                  <div class="field"><label>Linear Feet</label><input id="scnLF" type="number" value="${data.linearFeet||0}"/></div>
                  <div class="field"><label>Gate Count</label><input id="scnGates" type="number" value="${data.gateCount||0}"/></div>
                  <div class="field full"><label>Work Description</label><textarea id="scnDesc" style="min-height:90px;">${escHtml(data.description||'')}</textarea></div>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-foot">
            <button class="btn btn-ghost" onclick="App.closeModal()">Cancel</button>
            <button class="btn btn-gold" onclick="EstimateScanner.saveScanned()">${ICON.check} Save to Quote Sent</button>
          </div>
        </div>
      </div>
    `;
  },

  saveScanned() {
    if (!this._pending) return;
    const total = Number(document.getElementById('scnTotal').value) || 0;
    const data = {
      customerName: document.getElementById('scnName').value.trim() || 'Unknown Customer',
      phone: document.getElementById('scnPhone').value.trim(),
      email: document.getElementById('scnEmail').value.trim(),
      address: document.getElementById('scnAddress').value.trim(),
      town: document.getElementById('scnTown').value.trim(),
      serviceType: document.getElementById('scnService').value,
      priority: 'Medium',
      status: 'Quote Sent',
      linearFeet: Number(document.getElementById('scnLF').value) || 0,
      gateCount: Number(document.getElementById('scnGates').value) || 0,
      estimatedValue: total,
      totalValue: total,
      materialCost: Math.round(total * 0.42),
      laborCost: Math.round(total * 0.28),
      description: document.getElementById('scnDesc').value,
      estimateImage: this._pending.imageDataUrl,  // base64 PNG/JPEG
      scannedAt: Date.now(),
    };
    App.saveJob(data);
    this._pending = null;
    App.closeModal();
    toast('Scanned estimate saved to Quote Sent.', 'success');
  },
};
